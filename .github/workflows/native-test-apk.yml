name: Native test APK

# Secrets-free test build for the experimental native-resume fork.
# Upstream's own build/archive workflows need recloudstream/secrets, which
# this fork cannot access. This workflow only assembles the debug-signed
# stableNativeTest variant (separate package, no keystore needed).

on:
  push:
    branches: [feature/native-extension-resume]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-test-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "platforms;android-37.0" "build-tools;36.0.0"
          # compileSdk 37 resolves to platforms/android-37; the platform
          # package installs as android-37.0, so mirror it when missing.
          if [ ! -d "$ANDROID_HOME/platforms/android-37" ]; then
            cp -r "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build test APK and run unit tests
        run: ./gradlew :app:assembleStableNativeTest :app:testStableDebugUnitTest --no-daemon

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: Eimon-Cloudstream-Test-APK
          path: app/build/outputs/apk/stable/nativeTest/*.apk

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-test-reports
          path: app/build/reports/tests/
